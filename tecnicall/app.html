<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tecnicall | Panel (prototipo)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FFD000'/%3E%3Cpath d='M8 9h16v4h-6v12h-4V13H8z' fill='%23141208'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bk:#0F0F0D; --bk-2:#171714; --bk-3:#211F1B; --line:#34322C;
  --tx:#F3F1EA; --tx-2:#B4B0A4; --tx-3:#8A8678;
  --hz:#FFD000; --hz-2:#E6BB00; --hz-ink:#141208;
  --ok:#7BD88F;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bk);color:var(--tx);font-family:"Barlow",system-ui,sans-serif;font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.cd{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.005em;line-height:.92}
.mono{font-family:"JetBrains Mono",monospace}
.hz{color:var(--hz)}
.tape{height:14px;background:repeating-linear-gradient(-45deg,var(--hz) 0 18px,var(--bk) 18px 36px)}

/* buttons: all sharp, one rule */
.btn{display:inline-flex;align-items:center;gap:12px;font-family:"Barlow Condensed";font-weight:800;text-transform:uppercase;font-size:21px;letter-spacing:.02em;padding:15px 22px;background:var(--hz);color:var(--hz-ink);text-decoration:none;border:0;cursor:pointer;white-space:nowrap;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .18s}
.btn:hover{background:#FFDA33}
.btn:active{transform:translateY(1px)}
.btn .ar{display:inline-grid;place-items:center;width:28px;height:28px;background:var(--hz-ink);color:var(--hz);font-size:16px;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.btn:hover .ar{transform:translateX(3px)}
.link{font-weight:600;color:var(--tx-2);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.link:hover{color:var(--tx)}

/* nav */
nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Barlow Condensed";font-weight:900;font-size:28px;text-transform:uppercase;letter-spacing:.01em}
.logo i{width:26px;height:26px;background:var(--hz);display:grid;place-items:center;font-style:normal;color:var(--hz-ink);font-size:17px;font-weight:900}
.nl{display:flex;align-items:center;gap:26px}
.nl a.lang{display:inline;font-family:"JetBrains Mono";font-size:13px;border:1px solid var(--line);padding:4px 8px;text-decoration:none;color:var(--tx-2)}
.nl a.l:not(.lang){display:none;text-decoration:none;font-weight:600;font-size:16px;color:var(--tx-2)}
.nl a.l:hover{color:var(--tx)}
nav .btn{font-size:17px;padding:10px 14px}
@media(max-width:480px){.nl{gap:12px}nav .btn{font-size:16px;padding:9px 11px}.logo{font-size:24px}}
@media(min-width:860px){.nl a.l:not(.lang){display:inline}}

/* hero */
.hero{display:grid;gap:36px;padding:28px 0 56px}
.hero h1{font-size:clamp(54px,7.4vw,86px);font-weight:900}
.hero h1 span{display:block}
.hero h1 .br{display:inline}
.hero .lead{margin-top:22px;font-size:20px;color:var(--tx-2);max-width:470px}
.hero .lead b{color:var(--tx);font-weight:600}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:30px}
@media(min-width:980px){.hero{grid-template-columns:1.2fr 1fr;align-items:center;padding:40px 0 80px}}

/* route map + work order */
.map{position:relative;background:var(--bk-2);border:1px solid var(--line);aspect-ratio:1.08/1;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .hdr{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:12px 14px;font-family:"JetBrains Mono";font-size:12px;color:var(--tx-3);border-bottom:1px solid var(--line);background:rgba(15,15,13,.85);z-index:2}
.map .hdr b{color:var(--tx);font-weight:700}
.van{offset-path:path("M40 330 L110 330 L110 250 L160 250 L160 150 L330 150 L330 80 L440 80");offset-rotate:0deg;animation:drive 9s cubic-bezier(.45,.05,.35,1) infinite}
@keyframes drive{0%{offset-distance:0%}40%,55%{offset-distance:58%}90%,100%{offset-distance:100%}}
.wo{position:absolute;right:14px;bottom:14px;width:min(262px,58%);background:var(--tx);color:var(--hz-ink);font-size:13px;z-index:3;box-shadow:0 24px 40px -18px rgba(0,0,0,.7)}
@media(max-width:620px){.map{aspect-ratio:auto;overflow:visible;padding-top:250px}.map svg{height:300px}.wo{position:relative;right:auto;bottom:auto;width:auto;margin:0 12px 12px}}
.wo .top{background:var(--hz);padding:9px 12px;display:flex;justify-content:space-between;align-items:baseline;font-family:"Barlow Condensed";font-weight:900;font-size:20px;text-transform:uppercase}
.wo .top small{font-family:"JetBrains Mono";font-size:11px;font-weight:700}
.wo dl{display:grid;grid-template-columns:auto 1fr;padding:6px 12px 10px;font-family:"JetBrains Mono"}
.wo dt,.wo dd{padding:5px 0;border-bottom:1px dashed #C9C4B4}
.wo dt{color:#5E5A4E;padding-right:12px}
.wo dd{text-align:right;font-weight:700}
.wo dt:last-of-type,.wo dd:last-of-type{border-bottom:0}
.wo .src{border-top:2px solid var(--hz-ink);padding:8px 12px;font-size:12px;line-height:1.35}
.wo .src b{font-family:"JetBrains Mono";font-size:11px;display:block;color:#5E5A4E;font-weight:700}

/* conditions strip */
.cond{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cond .wrap{display:grid;grid-template-columns:1fr 1fr}
.cond .wrap>div{padding:18px 14px 18px 0;border-bottom:1px solid var(--line)}
.cond b{display:block;font-family:"Barlow Condensed";font-weight:800;font-size:22px;text-transform:uppercase}
.cond span{font-size:15px;color:var(--tx-2);line-height:1.4;display:block}
@media(min-width:860px){.cond .wrap{grid-template-columns:repeat(4,1fr)}.cond .wrap>div{border-bottom:0;border-right:1px solid var(--line);padding:22px 20px}.cond .wrap>div:first-child{padding-left:0}.cond .wrap>div:last-child{border-right:0}}

section{padding:88px 0}
h2{font-family:"Barlow Condensed";font-weight:900;text-transform:uppercase;font-size:clamp(44px,7vw,80px);line-height:.92;max-width:900px}
.sub{margin-top:18px;font-size:19px;color:var(--tx-2);max-width:620px}

/* day log */
.log{margin-top:44px;display:grid;gap:0;border-top:1px solid var(--line)}
.log div{display:grid;grid-template-columns:86px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.log time{font-family:"JetBrains Mono";font-weight:700;color:var(--hz);font-size:16px}
.log p{color:var(--tx-2)}
.log p b{color:var(--tx);font-weight:600}
@media(min-width:860px){.log div{grid-template-columns:140px 1fr 1fr}.log p.x{color:var(--tx)}}
.log .x{font-weight:600;grid-column:2}
@media(min-width:860px){.log .x{grid-column:auto}}
.log .x::before{content:"Con Tecnicall: ";color:var(--hz);font-family:"JetBrains Mono";font-size:13px;font-weight:700;text-transform:uppercase;display:block}
@media(min-width:860px){.log .x::before{display:none}.log .head{padding:0 0 12px;border-bottom:1px solid var(--line)}.log .head span{font-family:"JetBrains Mono";font-size:12px;text-transform:uppercase;color:var(--tx-3)}}
.log .head{display:none}
@media(min-width:860px){.log .head{display:grid}}

/* work order sheet (how it works) */
.sheet{margin-top:44px;background:var(--tx);color:var(--hz-ink);position:relative}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;background:var(--hz);font-family:"JetBrains Mono";font-size:13px;font-weight:700}
.sheet .sh b{font-family:"Barlow Condensed";font-size:28px;font-weight:900;text-transform:uppercase}
.row3{display:grid}
.row3 > div{padding:26px 22px;border-bottom:2px solid var(--hz-ink)}
.row3 > div:last-child{border-bottom:0}
.row3 h3{font-family:"Barlow Condensed";font-weight:900;font-size:40px;text-transform:uppercase;line-height:.95}
.row3 .k{font-family:"JetBrains Mono";font-size:12px;font-weight:700;color:#5E5A4E;text-transform:uppercase}
.row3 p{margin-top:10px;font-size:17px;color:#2E2B22}
.row3 ul{list-style:none;margin-top:16px;display:grid;gap:0;font-family:"JetBrains Mono";font-size:13px}
.row3 li{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed #C9C4B4}
.row3 li::before{content:"";width:13px;height:13px;border:2px solid var(--hz-ink);flex:none;background:linear-gradient(var(--hz-ink),var(--hz-ink)) center/5px 5px no-repeat}
@media(min-width:860px){.row3{grid-template-columns:1fr 1.15fr 1fr}.row3 > div{border-bottom:0;border-right:2px solid var(--hz-ink);padding:32px 28px}.row3 > div:last-child{border-right:0}}

/* morning board */
.board{margin-top:44px;border:1px solid var(--line);background:var(--bk-2)}
.board .bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);font-family:"JetBrains Mono";font-size:13px;color:var(--tx-2)}
.board .bar b{color:var(--tx)}
.lanes{display:grid}
.lane{padding:16px 18px;border-bottom:1px solid var(--line)}
.lane h4{display:flex;justify-content:space-between;align-items:baseline;font-family:"Barlow Condensed";font-weight:800;font-size:26px;text-transform:uppercase;margin-bottom:10px}
.lane h4 small{font-family:"JetBrains Mono";font-size:12px;color:var(--tx-3);font-weight:500;text-transform:none}
.job{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.job time{font-family:"JetBrains Mono";font-size:13px;color:var(--tx-3);padding-top:2px}
.job.new{color:var(--hz)}
.job.new time{color:var(--hz)}
.job em{font-style:normal;font-family:"JetBrains Mono";font-size:11px;background:var(--hz);color:var(--hz-ink);padding:1px 5px;margin-left:6px;font-weight:700;vertical-align:2px}
.job.done{color:var(--tx-3)}
@media(min-width:860px){.lanes{grid-template-columns:repeat(3,1fr)}.lane{border-bottom:0;border-right:1px solid var(--line)}.lane:last-child{border-right:0}}
.caption{margin-top:14px;font-size:14px;color:var(--tx-3)}

/* pricing: price list */
.prices{margin-top:44px;border-top:3px solid var(--hz)}
.pr{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:22px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pr h3{font-family:"Barlow Condensed";font-weight:900;font-size:40px;text-transform:uppercase;line-height:1}
.pr .p{font-family:"Barlow Condensed";font-weight:900;font-size:52px;line-height:1;text-align:right}
.pr .p small{font-size:20px;color:var(--tx-2);font-weight:700}
.pr .who{grid-column:1/-1;color:var(--tx-2);font-size:16px}
.pr .p{grid-column:2;grid-row:1}
.pr .who b{color:var(--tx);font-weight:600}
.pr.hi h3,.pr.hi .p{color:var(--hz)}
@media(min-width:860px){.pr{grid-template-columns:220px 1fr 200px;align-items:center}.pr .who{grid-column:auto}.pr .p{grid-column:auto;grid-row:auto}}
.note{margin-top:18px;font-size:15px;color:var(--tx-3);max-width:760px}

/* faq */
.faq{margin-top:36px;display:grid}
@media(min-width:860px){.faq{grid-template-columns:1fr 1fr;column-gap:48px}}
details{border-top:1px solid var(--line);padding:18px 0}
summary{font-weight:700;font-size:19px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--hz);font-family:"JetBrains Mono";font-size:22px;line-height:1}
details[open] summary::after{content:"-"}
details p{margin-top:10px;color:var(--tx-2);font-size:17px}

/* founder */
.founder{display:grid;gap:24px;border:1px solid var(--line);padding:28px}
.founder .av{width:64px;height:64px;background:var(--hz);color:var(--hz-ink);display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:900;font-size:36px}
.founder p{font-size:20px;max-width:720px}
.founder p+p{margin-top:12px;color:var(--tx-2);font-size:18px}
.founder cite{display:block;margin-top:16px;font-style:normal;font-family:"JetBrains Mono";font-size:13px;color:var(--tx-3)}
@media(min-width:860px){.founder{grid-template-columns:80px 1fr;padding:40px}}

/* final */
.final{border-top:1px solid var(--line)}
.final .grid{display:grid;gap:40px}
@media(min-width:980px){.final .grid{grid-template-columns:1fr 1fr;align-items:start}}
.next{list-style:none;margin-top:28px;display:grid;gap:0;counter-reset:n}
.next li{counter-increment:n;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line);color:var(--tx-2)}
.next li::before{content:counter(n);width:32px;height:32px;background:var(--hz);color:var(--hz-ink);display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:900;font-size:20px}
.next b{color:var(--tx);font-weight:600}
form{background:var(--tx);color:var(--hz-ink);padding:26px;display:grid;gap:16px}
form h3{font-family:"Barlow Condensed";font-weight:900;font-size:34px;text-transform:uppercase;line-height:1}
label{display:grid;gap:6px;font-weight:600;font-size:15px}
input{font:inherit;font-size:17px;padding:13px 14px;border:2px solid #9A9585;background:#fff;color:var(--hz-ink);width:100%;border-radius:0}
input::placeholder{color:#76715F}
input:focus{outline:3px solid var(--hz);outline-offset:0;border-color:var(--hz-ink)}
form .btn{justify-content:space-between;width:100%;background:var(--hz-ink);color:var(--hz)}
form .btn .ar{background:var(--hz);color:var(--hz-ink)}
form .btn:hover{background:#2A271C}
.fine{font-size:13px;color:#4F4B40}
.err{color:#8A1F00;font-size:14px;font-weight:600;display:none}
.thanks{display:none}
.thanks p{margin-top:10px;color:#2E2B22}
footer{padding:28px 0 32px;border-top:1px solid var(--line);font-size:15px;color:var(--tx-3)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer .wrap>span:last-child{flex-wrap:wrap}
footer a{color:var(--tx-2)}

/* sticky mobile CTA */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bk);border-top:2px solid var(--hz);padding:10px 12px calc(10px + env(safe-area-inset-bottom));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sticky span{font-size:14px;line-height:1.25;color:var(--tx-2)}
.sticky span b{color:var(--tx)}
.sticky .btn{font-size:18px;padding:11px 14px}
.sticky.hide{transform:translateY(110%)}
@media(min-width:760px){.sticky{display:none}}
@media(max-width:759px){footer{padding-bottom:100px}section{padding:64px 0}}


/* interactive demo */
.demo{margin-top:40px;display:grid;gap:20px}
@media(min-width:980px){.demo{grid-template-columns:.9fr 1.1fr;gap:28px}}
.ctrl{display:grid;gap:18px;align-content:start}
.ctrl label{color:var(--tx)}
.ctrl input{background:var(--bk);color:var(--tx);border:2px solid var(--line)}
.ctrl input::placeholder{color:var(--tx-3)}
.ctrl input:focus{border-color:var(--hz);outline:0}
.sc{display:grid;gap:8px}
.sc button{font:inherit;text-align:left;background:var(--bk);color:var(--tx);border:2px solid var(--line);padding:12px 14px;cursor:pointer;display:grid;gap:2px;min-height:48px}
.sc button small{font-family:"JetBrains Mono";font-size:12px;color:var(--tx-3)}
.sc button[aria-pressed="true"]{border-color:var(--hz);background:var(--bk-3)}
.sc button:hover{border-color:var(--tx-3)}
.chat{background:var(--bk);border:1px solid var(--line);display:flex;flex-direction:column;min-height:380px}
@media(min-width:980px){.chat{min-height:460px}}
.btn.ol{background:transparent;color:var(--hz);border:2px solid var(--hz)}
.btn.ol .ar{background:var(--hz);color:var(--hz-ink)}
.btn.ol:hover{background:var(--bk-3)}
.chat .ch{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-family:"JetBrains Mono";font-size:12px;color:var(--tx-3)}
.chat .ch b{color:var(--tx);font-weight:700}
.msgs{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.bub{max-width:86%;padding:9px 12px;font-size:16px;line-height:1.4;animation:in .35s cubic-bezier(.2,.8,.2,1)}
.bub.c{align-self:flex-end;background:var(--bk-3);color:var(--tx)}
.bub.a{align-self:flex-start;background:var(--tx);color:var(--hz-ink)}
.bub.sys{align-self:stretch;max-width:none;background:var(--hz);color:var(--hz-ink);font-family:"JetBrains Mono";font-size:13px;font-weight:700}
.typing{align-self:flex-start;font-family:"JetBrains Mono";font-size:13px;color:var(--tx-3)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}
/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.van{animation:none;offset-distance:58%}html{scroll-behavior:auto}}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--hz);outline-offset:3px}
</style>
<style>
.app{display:grid;gap:0;border:1px solid var(--line);margin-top:20px;min-height:560px}
@media(min-width:900px){.app{grid-template-columns:360px 1fr}}
.list{border-bottom:1px solid var(--line)}
@media(min-width:900px){.list{border-bottom:0;border-right:1px solid var(--line)}}
.flt{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.flt button,.act button,.act select{font:inherit;font-size:14px;font-family:"JetBrains Mono";background:var(--bk);color:var(--tx-2);border:1px solid var(--line);padding:8px 10px;cursor:pointer;min-height:40px}
.flt button[aria-pressed="true"]{border-color:var(--hz);color:var(--hz)}
.it{display:grid;grid-template-columns:52px 1fr auto;gap:10px;width:100%;text-align:left;font:inherit;color:var(--tx);background:none;border:0;border-bottom:1px solid var(--line);padding:14px 12px;cursor:pointer}
.it:hover{background:var(--bk-2)}.it[aria-current="true"]{background:var(--bk-3);box-shadow:inset 3px 0 0 var(--hz)}
.it time{font-family:"JetBrains Mono";font-size:13px;color:var(--tx-3)}
.it small{display:block;color:var(--tx-3);font-size:14px}
.st{font-family:"JetBrains Mono";font-size:11px;font-weight:700;padding:2px 6px;align-self:start;background:var(--bk-3);color:var(--tx-2)}
.st.nuevo{background:var(--hz);color:var(--hz-ink)}.st.urgente{background:#FF6B4A;color:#1A0A05}.st.confirmado{background:#1F3B27;color:var(--ok)}
.det{padding:20px}
.det h2{font-size:44px;margin-bottom:6px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-family:"JetBrains Mono";font-size:14px;margin:16px 0;color:var(--tx-2)}
.meta b{color:var(--tx);font-weight:700}
.tr{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.tr p{font-size:16px;color:var(--tx-2)}.tr p b{color:var(--tx);font-family:"JetBrains Mono";font-size:12px;margin-right:6px}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.act .ok{background:var(--hz);color:var(--hz-ink);border-color:var(--hz);font-weight:700}
.toast{margin-top:12px;font-family:"JetBrains Mono";font-size:13px;color:var(--ok);min-height:18px}
.lbl{display:inline-block;font-family:"JetBrains Mono";font-size:12px;background:var(--bk-3);color:var(--hz);padding:3px 8px;margin-left:10px;vertical-align:middle}
</style>
</head>
<body>
<header class="wrap"><nav><a class="logo" href="index.html"><i>T</i>Tecnicall</a><div class="nl"><a class="btn" href="index.html#probar">Oír mi demo</a></div></nav></header>
<main class="wrap" style="padding-bottom:60px">

</main>
<footer><div class="wrap"><span>Tecnicall · prototipo con datos de ejemplo</span><span style="display:flex;gap:18px;flex-wrap:wrap"><a href="index.html">Inicio</a><a href="aviso-legal.html">Aviso legal</a><a href="privacidad.html">Privacidad</a></span></div></footer>
<script>
(function(){
var T=['Marc','Pau','Laia'];
var A=[
 {id:'0418',h:'21:49',c:'WhatsApp',e:'Lavadora Bosch WAT28',f:'E18 · no desagua',z:'Gràcia',t:'Marc',s:'nuevo',slot:'Mañana 09:30',tr:[['Cliente','La lavadora no centrifuga y pita. Es una Bosch.'],['Asistente','¿Me mandas una foto de la pantalla y de la etiqueta?'],['Cliente','[foto] E18 · WAT28'],['Asistente','Tengo mañana a las 9:30 o a las 16:00. La salida son 35 €.'],['Cliente','9:30 perfecto']]},
 {id:'0419',h:'23:10',c:'Llamada',e:'Fregadero',f:'Fuga activa',z:'Sant Andreu',t:'Laia',s:'urgente',slot:'Hoy 10:45',tr:[['Cliente','Sale agua de debajo del fregadero y no para.'],['Asistente','Cierra la llave de paso girando a la derecha. Aviso al técnico de guardia.'],['Sistema','Pasado al móvil del dueño a las 23:11.']]},
 {id:'0420',h:'07:12',c:'Llamada',e:'Termo Junkers',f:'No calienta',z:'Eixample',t:'Marc',s:'confirmado',slot:'Hoy 11:00',tr:[['Cliente','El termo no calienta desde ayer.'],['Asistente','¿Sale alguna luz o código? Tengo hoy a las 11:00.'],['Cliente','Vale, a las 11.']]},
 {id:'0421',h:'08:05',c:'Llamada',e:'Nevera LG',f:'Ruido fuerte',z:'Les Corts',t:'Pau',s:'nuevo',slot:'Miércoles 13:00',tr:[['Cliente','Bon dia, la nevera fa un soroll molt fort.'],['Asistente','Quina marca és? Tinc dimecres a les 13:00.'],['Cliente','LG. Perfecte.']]}
];
var cur=A[0].id,flt='todos',items=document.getElementById('items'),det=document.getElementById('det');
function esc(x){var d=document.createElement('div');d.textContent=x;return d.innerHTML}
function list(){items.innerHTML='';A.filter(function(a){return flt==='todos'||a.s===flt}).forEach(function(a){
  var b=document.createElement('button');b.type='button';b.className='it';b.setAttribute('aria-current',a.id===cur);
  b.innerHTML='<time>'+a.h+'</time><span>'+esc(a.e)+'<small>'+esc(a.f)+' · '+esc(a.z)+'</small></span><span class="st '+a.s+'">'+a.s.toUpperCase()+'</span>';
  b.onclick=function(){cur=a.id;list();show()};items.appendChild(b)});}
function show(){var a=A.filter(function(x){return x.id===cur})[0];if(!a){det.innerHTML='';return}
  det.innerHTML='<h2 class="cd">Aviso '+a.id+'</h2><span class="st '+a.s+'">'+a.s.toUpperCase()+'</span>'+
  '<div class="meta"><span>Canal</span><b>'+a.c+' · '+a.h+'</b><span>Equipo</span><b>'+esc(a.e)+'</b><span>Fallo</span><b>'+esc(a.f)+'</b><span>Zona</span><b>'+esc(a.z)+'</b><span>Técnico</span><b id="tc">'+a.t+'</b><span>Hora</span><b>'+a.slot+'</b></div>'+
  '<div class="tr">'+a.tr.map(function(m){return '<p><b>'+m[0].toUpperCase()+'</b>'+esc(m[1])+'</p>'}).join('')+'</div>'+
  '<div class="act"><button type="button" class="ok" id="cf">Confirmar</button><label for="rs" style="font-size:14px;color:var(--tx-2)">Técnico</label><select id="rs">'+T.map(function(t){return '<option'+(t===a.t?' selected':'')+'>'+t+'</option>'}).join('')+'</select></div><p class="toast" id="to"></p>';
  document.getElementById('cf').onclick=function(){a.s='confirmado';list();show();document.getElementById('to').textContent='Confirmado. El cliente recibe un WhatsApp con la hora.'};
  document.getElementById('rs').onchange=function(e){a.t=e.target.value;document.getElementById('tc').textContent=a.t;document.getElementById('to').textContent='Reasignado a '+a.t+'. Se mueve en su ruta.'};}
document.querySelectorAll('.flt button').forEach(function(b){b.onclick=function(){flt=b.dataset.f;document.querySelectorAll('.flt button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});list()}});
list();show();
})();
</script>
</body></html>
