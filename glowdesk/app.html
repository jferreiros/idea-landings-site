<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowdesk · Prototipo de la bandeja</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F7EDEB'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23A65468'/%3E%3Ccircle cx='13.5' cy='13.5' r='3' fill='%23F2D2D8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7EDEB;--paper:#FCF8F7;--ink:#1B2621;--muted:#5E6A64;--line:#EAD9D7;--sage:#34503F;--sage-soft:#DFE8E1;--rose:#A65468;--rose-soft:#F3DEE1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--sage)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:"Bodoni Moda",serif;font-size:1.5rem;display:flex;align-items:center;gap:8px}
.logo i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F2D2D8,var(--rose))}
.sample{font-size:.78rem;font-weight:700;background:var(--rose-soft);color:#8A3F52;border-radius:999px;padding:5px 12px}
.app{display:grid;gap:16px;padding:16px 20px;max-width:1200px;margin:0 auto}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font:600 .85rem Manrope,sans-serif;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.row[aria-current="true"]{border:2px solid var(--sage)}
.row .t{display:flex;justify-content:space-between;gap:8px}.row small{color:var(--muted);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:.74rem;padding:3px 9px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-weight:600}.tag.ok{background:var(--rose-soft);color:#8A3F52}.tag.warn{background:#F7EBD8;color:#7A5620}
h2{font-family:"Bodoni Moda",serif;font-weight:400;font-size:1.5rem}
.thread{display:flex;flex-direction:column;gap:8px;margin:12px 0;font-size:.9rem}
.m{max-width:85%;padding:9px 13px;border-radius:16px}.in{background:#F3E9E8;align-self:flex-start}.out{background:var(--sage);color:#fff;align-self:flex-end}.sys{align-self:center;font-size:.78rem;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .9rem Manrope,sans-serif;min-height:44px;padding:10px 18px;border-radius:999px;border:0;background:var(--sage);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--sage);border:1.5px solid var(--sage)}
.btn:active{transform:scale(.98)}
.status{font-size:.85rem;color:var(--muted);margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi small{font-size:.72rem;color:var(--muted);display:block}.kpi b{font-family:"Bodoni Moda",serif;font-weight:400;font-size:1.6rem;white-space:nowrap}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
@media(min-width:860px){.app{grid-template-columns:360px 1fr}.kpis{grid-column:1/-1}}
</style>
</head>
<body>
<header><span class="logo"><i></i>Glowdesk</span><span class="sample">Datos de ejemplo · prototipo</span><a href="index.html">Volver a la web</a></header>
<div class="app">
  <div class="kpis"><div class="kpi"><small>Conversaciones</small><b id="k1">4</b></div><div class="kpi"><small>Valoraciones</small><b id="k2">2</b></div><div class="kpi"><small>Pendientes</small><b id="k3">3</b></div></div>
  <div class="panel">
    <div class="tabs" role="group" aria-label="Filtrar"><button type="button" data-f="all" aria-pressed="true">Todos</button><button type="button" data-f="paid" aria-pressed="false">Con señal</button><button type="button" data-f="doc" aria-pressed="false">Para la doctora</button><button type="button" data-f="human" aria-pressed="false">Persona</button></div>
    <div id="list"></div>
  </div>
  <div class="panel" aria-live="polite"><h2 id="who"></h2><div class="tags" id="tg"></div><div class="thread" id="th"></div><div class="acts" id="acts"></div><p class="status" id="st"></p></div>
</div>
<script>
var L=[
 {id:1,n:'Laura M.',src:'Instagram · 23:47',tags:[['Rinomodelado',''],['Señal 20 € pagada','ok'],['Lactancia: revisar','warn']],f:['paid','doc'],msgs:[['in','¿Cuánto cuesta el rinomodelado?'],['out','Parte de 350 €. El precio final lo fija la doctora en la valoración, gratuita.'],['in','Estoy dando el pecho, ¿importa?'],['out','Lo valora la doctora. Le dejo el aviso. ¿Te va bien el miércoles a las 18:30?'],['in','Sí'],['sys','Señal de 20 € pagada · Valoración mié 18:30']],act:'doc'},
 {id:2,n:'Marta G.',src:'WhatsApp · 09:12',tags:[['Láser piernas',''],['Señal 15 € pagada','ok']],f:['paid'],msgs:[['in','¿Precio del bono de piernas?'],['out','El bono de 6 sesiones parte de 300 €. ¿Primera sesión el jueves a las 12:00?'],['in','Perfecto'],['sys','Señal de 15 € pagada · Jue 12:00']],act:null},
 {id:3,n:'+34 6•• ••• 412',src:'Llamada · 21:10',tags:[['Peeling químico',''],['Pide persona','warn']],f:['human'],msgs:[['in','Quiero hablar con alguien de la clínica sobre cicatrices de acné.'],['out','Claro. Paso tu mensaje a recepción; mañana a partir de las 10:00 te llaman.'],['sys','Agente en pausa en esta conversación']],act:'human'},
 {id:4,n:'Nuria P.',src:'Instagram · 01:05',tags:[['Labios',''],['Sin señal','warn']],f:['human'],msgs:[['in','¿Hacéis labios? ¿Precio?'],['out','Sí, parte de 280 €. ¿Te busco hueco para la valoración gratuita?'],['sys','Sin respuesta en 30 min · hueco liberado · seguimiento en 24 h']],act:'follow'}
];
var cur=1,flt='all',done={};
function list(){var h='';L.forEach(function(x){if(flt!=='all'&&x.f.indexOf(flt)<0)return;h+='<button type="button" class="row" data-id="'+x.id+'" aria-current="'+(x.id===cur)+'"><span class="t"><b>'+x.n+'</b><small>'+x.src+'</small></span><span class="tags">'+x.tags.map(function(t){return '<span class="tag '+t[1]+'">'+t[0]+'</span>';}).join('')+'</span></button>';});document.getElementById('list').innerHTML=h||'<p class="status">Nada en este filtro.</p>';document.querySelectorAll('.row').forEach(function(b){b.onclick=function(){cur=+b.dataset.id;list();show();};});}
function show(){var x=L.filter(function(y){return y.id===cur;})[0];document.getElementById('who').textContent=x.n;document.getElementById('tg').innerHTML=x.tags.map(function(t){return '<span class="tag '+t[1]+'">'+t[0]+'</span>';}).join('');document.getElementById('th').innerHTML=x.msgs.map(function(m){return '<div class="m '+m[0]+'">'+m[1]+'</div>';}).join('');var a='',st=done[x.id]||'';
 if(!done[x.id]){if(x.act==='doc')a='<button class="btn" data-a="Revisado por la doctora. La paciente recibe: «La doctora ha revisado tu caso, te esperamos el miércoles».">Marcar revisado por la doctora</button>';if(x.act==='human')a='<button class="btn" data-a="Asignado a recepción. Llamada programada hoy a las 10:30.">Asignar a recepción</button><button class="btn ghost" data-a="Agente reactivado en esta conversación.">Devolver al agente</button>';if(x.act==='follow')a='<button class="btn" data-a="Seguimiento enviado: «¿Te sigue interesando la valoración? Tengo hueco el viernes».">Enviar seguimiento ahora</button>';}
 document.getElementById('acts').innerHTML=a;document.getElementById('st').textContent=st;document.querySelectorAll('#acts .btn').forEach(function(b){b.onclick=function(){done[x.id]=b.dataset.a;var p=L.filter(function(y){return y.act&&!done[y.id];}).length;document.getElementById('k3').textContent=p;show();};});}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){flt=b.dataset.f;document.querySelectorAll('.tabs button').forEach(function(z){z.setAttribute('aria-pressed',z===b);});list();};});
list();show();
</script>
</body>
</html>
